server {
    # 1. 改为监听 80 端口 (HTTP)
    listen 80;
    
    # 2. 将域名修改为你的服务器 IP
    server_name 149.104.31.74; 

    # 3. 保持原有路径不变
    root /var/www/cardkey-web;
    index index.html;

    # Vite/React 前端路由核心配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存配置
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}